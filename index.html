<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The page is a React app (src/). The build fills the title, description, keywords and
         og:title/og:description below from "meta" in src/locales/<language>.json, and makes a
         copy of this page per language (zh-hant/, zh-hans/): see build/language-pages.js. -->
    <title>Proximater - Real-Time Location Discovery App | Live Business Broadcasting</title>
    <meta
      property="og:title"
      content="Proximater | Your city is changing right now. Your map isn't."
    />
    <meta
      property="og:description"
      content="The YouTube for location services. Broadcast your business presence in real-time while Google Maps makes you jump through hoops. Available now on iOS & Android."
    />
    <meta
      name="description"
      content="Real-time location discovery app that lets businesses broadcast their presence instantly. No bureaucratic approvals like Google Maps. Find what's actually happening around you right now."
    />
    <meta
      name="keywords"
      content="real time maps, live location, instant discovery, business broadcast, local events, nearby restaurants, what's open now, location app, proximater, live maps, real-time discovery"
    />
    <meta name="image" property="og:image" content="/images/website.jpg" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="author" content="Westley Cooper-Thorn" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" sizes="152x152" href="images/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="images/apple-touch-icon-120x120.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="images/apple-touch-icon-76x76.png" />
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,900" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
